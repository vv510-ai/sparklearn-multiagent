databases:
  - name: sparklearn-db
    plan: free
    region: singapore
    databaseName: sparklearn
    user: sparklearn

services:
  - type: web
    name: sparklearn-backend
    runtime: docker
    plan: free
    region: singapore
    branch: main
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sparklearn-db
          property: connectionString
      - key: OBJECT_STORAGE_ENDPOINT
        sync: false
      - key: OBJECT_STORAGE_BUCKET
        sync: false
      - key: OBJECT_STORAGE_ACCESS_KEY
        sync: false
      - key: OBJECT_STORAGE_SECRET_KEY
        sync: false
      - key: OBJECT_STORAGE_REGION
        value: auto
      - key: AUTH_SECRET
        sync: false
      - key: AUTH_REQUIRED
        value: "true"
      - key: AUTH_TOKEN_MINUTES
        value: "10080"
      - key: SPARK_API_PASSWORD
        sync: false
      - key: SPARK_APPID
        sync: false
      - key: SPARK_API_KEY
        sync: false
      - key: SPARK_API_SECRET
        sync: false
      - key: SPARK_BASE_URL
        value: https://spark-api-open.xf-yun.com/v1/
      - key: SPARK_X2_BASE_URL
        value: https://spark-api-open.xf-yun.com/x2/
      - key: SPARK_REASONING_MODE
        value: auto
      - key: SPARK_IMAGE_DOMAIN
        value: general
      - key: EMBEDDING_BACKEND
        value: bge-small-zh
      - key: RERANK_MODE
        value: auto
      - key: DEMO_MODE
        value: "false"
      - key: TRACE_ENABLED
        value: "false"
      - key: FRONTEND_ORIGIN
        value: https://sparklearn-multiagent.vercel.app
      - key: MM_OCR_ENABLED
        value: "true"
      - key: MM_LOCAL_OCR_ENABLED
        value: "true"
      - key: MM_TTS_ENABLED
        value: "true"
      - key: SPARK_SUPER_TTS_API_PASSWORD
        sync: false
      - key: SPARK_SUPER_TTS_URL
        value: wss://cbm01.cn-huabei-1.xf-yun.com/v1/private/mcd9m97e6
      - key: SPARK_SUPER_TTS_VOICE
        value: x6_lingxiaoxuan_pro
      - key: SPARK_ASR_URL
        value: wss://iat.xf-yun.com/v1
      - key: MM_ASR_ENABLED
        value: "true"
      - key: MM_ASR_TIMEOUT_S
        value: "75"
      - key: MM_IMAGE_ENABLED
        value: "true"
      - key: MM_VIDEO_ENABLED
        value: "true"
      - key: XYQ_ACCESS_KEY
        sync: false
      - key: XYQ_BASE_URL
        value: https://xyq.jianying.com
      - key: XYQ_VIDEO_MODEL
        value: Seedance_2.0_mini_lite
      - key: XYQ_VIDEO_RATIO
        value: "16:9"
      - key: XYQ_VIDEO_DURATION
        value: "5"
      - key: XYQ_VIDEO_RESOLUTION
        value: 720p
      - key: PYTHONUNBUFFERED
        value: "1"
