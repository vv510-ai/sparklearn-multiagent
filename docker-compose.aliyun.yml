name: sparklearn

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sparklearn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: sparklearn
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sparklearn"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    mem_limit: 192m

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://sparklearn:${POSTGRES_PASSWORD}@postgres:5432/sparklearn
      REDIS_URL: redis://redis:6379/0
      FRONTEND_ORIGIN: http://${PUBLIC_HOST}
      AUTH_REQUIRED: "true"
      DEMO_MODE: "false"
      EMBEDDING_BACKEND: bge-small-zh
      RERANK_MODE: auto
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - gen_static:/srv/app/static/gen
      - uploaded_sources:/srv/app/data/uploaded_sources
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=10)"]
      interval: 15s
      timeout: 12s
      retries: 20
      start_period: 60s
    mem_limit: 2304m

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    mem_limit: 512m

volumes:
  pgdata:
  redisdata:
  gen_static:
  uploaded_sources:
