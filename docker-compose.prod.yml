name: sparklearn

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sparklearn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: sparklearn
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sparklearn -d sparklearn"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    restart: unless-stopped

  backend:
    image: sparklearn-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://sparklearn:${POSTGRES_PASSWORD}@postgres:5432/sparklearn
      REDIS_URL: redis://redis:6379/0
      FRONTEND_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      AUTH_REQUIRED: "true"
      DEMO_MODE: "false"
      APP_RELEASE: ${IMAGE_TAG:-unknown}
      TRACE_ENABLED: "true"
      EMBEDDING_BACKEND: bge-small-zh
      RERANK_MODE: auto
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    expose:
      - "8000"
    volumes:
      - gen_static:/srv/app/static/gen
      - uploaded_sources:/srv/app/data/uploaded_sources
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"
      interval: 15s
      timeout: 8s
      retries: 12
      start_period: 90s
    mem_limit: 2300m
    restart: unless-stopped

  frontend:
    image: sparklearn-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
      # Only Nginx can reach this container; it overwrites forwarded headers.
      TRUST_PROXY_HEADERS: "true"
      HOSTNAME: "0.0.0.0"
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/', {signal: AbortSignal.timeout(5000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 8s
      retries: 12
      start_period: 15s
    mem_limit: 768m
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      TLS_CERT_NAME: ${TLS_CERT_NAME:-47.121.24.54}
      TLS_ENABLED: ${TLS_ENABLED:-false}
      TLS_REDIRECT: ${TLS_REDIRECT:-true}
    command: ["/bin/sh", "/usr/local/bin/sparklearn-nginx-start.sh"]
    volumes:
      - ./deploy/nginx.conf:/etc/sparklearn/nginx.http.conf:ro
      - ./deploy/nginx.https.conf:/etc/sparklearn/nginx.https.conf:ro
      - ./deploy/nginx.redirect.conf:/etc/sparklearn/nginx.redirect.conf:ro
      - ./deploy/nginx-start.sh:/usr/local/bin/sparklearn-nginx-start.sh:ro
      - ${LETSENCRYPT_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro
      - ${LETSENCRYPT_WEBROOT:-/opt/sparklearn/shared/letsencrypt-webroot}:/var/www/certbot:ro
    mem_limit: 128m
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  gen_static:
  uploaded_sources:
