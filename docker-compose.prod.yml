name: sparklearn

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sparklearn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: sparklearn
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sparklearn -d sparklearn"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    restart: unless-stopped

  backend:
    image: sparklearn-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://sparklearn:${POSTGRES_PASSWORD}@postgres:5432/sparklearn
      REDIS_URL: redis://redis:6379/0
      FRONTEND_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      AUTH_REQUIRED: "true"
      DEMO_MODE: "false"
      TRACE_ENABLED: "true"
      EMBEDDING_BACKEND: bge-small-zh
      RERANK_MODE: auto
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    expose:
      - "8000"
    volumes:
      - gen_static:/srv/app/static/gen
      - uploaded_sources:/srv/app/data/uploaded_sources
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"
      interval: 15s
      timeout: 8s
      retries: 12
      start_period: 90s
    mem_limit: 2300m
    restart: unless-stopped

  frontend:
    image: sparklearn-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3000"
    mem_limit: 768m
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 128m
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  gen_static:
  uploaded_sources:
